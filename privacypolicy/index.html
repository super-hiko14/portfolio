<style>
:root{
  color-scheme:light;
  --bg:#dcede1;     /* 背景 */
  --ink:#1c231e;    /* 点灯している点 */
  --mark:#c5ddcc;   /* 消えている点 */
  --line:#607363;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg)}
body{
  display:grid;place-items:center;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  animation:fade .6s ease-out;          /* 開いたとき、ふわっと */
}
.stage{display:flex;flex-direction:column;align-items:center;gap:30px}

/* 絵（ドットがぼやけないように、整数倍で表示） */
.sprite{
  display:block;width:112px;height:auto;
  image-rendering:pixelated;image-rendering:crisp-edges;
  animation:fade .8s ease-out .1s backwards;
  user-select:none;-webkit-user-drag:none;
}

/* ドットが順番に点く */
.dots{display:flex;gap:12px;animation:fade .8s ease-out .3s backwards}
.dots i{display:block;width:12px;height:12px;background:var(--mark);animation:dot 1.2s steps(1,end) infinite}
.dots i:nth-child(2){animation-delay:.4s}
.dots i:nth-child(3){animation-delay:.8s}
@keyframes dot{0%{background:var(--ink)}33.34%,100%{background:var(--mark)}}   /* 1.2秒で一周：1つずつ0.4秒ずつ点く */
@keyframes fade{from{opacity:0}to{opacity:1}}

/* 進まないとき用：数秒たったら、そっとリンクが出る */
.fallback{
  position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));
  text-align:center;font:16px/1.9 "MaruMinya","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  opacity:0;animation:fade .6s ease-out 6s forwards;
}
.fallback a{color:var(--line);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}

.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

@media (prefers-reduced-motion:reduce){
  body,.sprite,.dots{animation:none}
  .dots i{animation:none;background:var(--ink)}
}
</style>
</head>
