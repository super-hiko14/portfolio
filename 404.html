<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>404 — Super Hiko14</title>
<script>
  /* 前のサイトにあって、いまはトップにまとめたページはトップへ */
  (function () {
    var TO_TOP = ["links_b", "beta"];
    if (TO_TOP.indexOf(location.pathname.split("/")[1]) !== -1) location.replace("/");
  })();
</script>
<meta name="theme-color" content="#dcede1">
<link rel="icon" href="/favicon.ico" sizes="any">

<style>
.page{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.lost img{
  width:112px;height:112px;
  image-rendering:pixelated;image-rendering:crisp-edges;
  -webkit-user-drag:none;user-select:none;
  animation:sway 2.4s steps(2,end) infinite;
}
@keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(-4px)}}
.code{margin:0;font-family:var(--pixel);font-size:56px;line-height:1;color:var(--line)}
@media (prefers-reduced-motion:reduce){.lost img{animation:none}}
</style>
