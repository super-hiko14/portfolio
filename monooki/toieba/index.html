<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トイエバ — 打てば返る万能ボックス</title>
<meta name="description" content="計算・単位変換・日付・色・パスワード生成・ToDo・タイマーを、ひとつの入力欄で。打てば返る万能ボックス。">
<script>
// 描画前にテーマを決める (白い画面が一瞬出るのを防ぐ)。詳しい適用は app.js
(function () {
  var r = document.documentElement, s = {};
  try { s = JSON.parse(localStorage.getItem('toieba:settings')) || {}; } catch (e) {}
  var dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  r.dataset.theme = dark ? 'dark' : 'light';
  if (/^#[0-9a-f]{6}$/i.test(s.accent || '')) r.style.setProperty('--accent', s.accent);
  // Windows 版 (WebView2) か、確認用の ?app
  if ((window.chrome && window.chrome.webview) || /[?&]app\b/.test(location.search)) r.classList.add('app');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+Antique:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div class="mark" data-i18n="mark">トイエバ</div>
    <div class="hdr-btns" id="tools">
      <button id="bookmark" class="icon-btn" type="button" data-i18n-title="tBookmark" disabled>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button id="info" class="icon-btn" type="button" data-i18n-title="tHelp">i</button>
      <button id="gear" class="icon-btn" type="button" data-i18n-title="tSettings">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="box inputbox" id="inputbox">
    <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus
      data-i18n-ph="placeholder" placeholder="例: 3980 + 10%">
  </div>

  <div id="bmToggleWrap" hidden>
    <button id="bmToggle" type="button" data-i18n-title="tShowBookmarks">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <div id="result" class="box" hidden>
    <div class="res-inner">
      <div class="res-head">
        <div class="res-label" id="rlabel"></div>
        <button id="regen" type="button" data-i18n-title="tRegen" hidden>
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
      <div class="res-big" id="rbig" tabindex="0" role="button" data-i18n-title="tCopy"></div>
      <div class="res-rows" id="rrows"></div>

      <div class="panel" id="cpanel" hidden>
        <div class="cp-row">
          <div class="cp-square" id="cpSquare">
            <div class="cp-square-white"></div>
            <div class="cp-square-black"></div>
            <div class="cp-cursor" id="cpCursor"></div>
          </div>
        </div>
        <div class="cp-row cp-controls">
          <div class="cp-sliders">
            <input type="range" id="cpHue" min="0" max="360" value="150" class="cp-slider cp-hue" data-i18n-title="tHue">
            <input type="range" id="cpAlpha" min="0" max="100" value="100" class="cp-slider cp-alpha" data-i18n-title="tAlpha">
          </div>
          <div class="cp-preview"><i id="cpPreview"></i></div>
        </div>
        <div class="cp-row cp-hexrow">
          <span class="cp-hash">#</span>
          <input type="text" id="cpHex" maxlength="8" class="field cp-hex" spellcheck="false" autocomplete="off" data-i18n-title="tHex">
          <span class="cp-alpha-val" id="cpAlphaVal">100%</span>
          <button type="button" id="cpApply" class="btn" data-i18n="done">決定</button>
        </div>
        <div class="cp-row cp-presets" id="cpPresets"></div>
      </div>

      <div class="panel" id="ppanel" hidden>
        <div class="pp-len">
          <span data-i18n="passLen">長さ</span>
          <input type="range" id="ppLen" class="pp-range" min="4" max="64" value="16" data-i18n-title="passLen">
          <output id="ppLenVal">16</output>
        </div>
        <div class="toggles" id="ppToggles">
          <button type="button" class="tgl" data-k="upper"><span>A-Z</span></button>
          <button type="button" class="tgl" data-k="lower"><span>a-z</span></button>
          <button type="button" class="tgl" data-k="digit"><span>0-9</span></button>
          <button type="button" class="tgl" data-k="sym"><span>!#$</span></button>
          <button type="button" class="tgl" data-k="ambig" data-i18n="passAmbig">紛らわしい文字も使う</button>
        </div>
      </div>

      <div class="panel" id="tpanel" hidden>
        <div class="tp-add">
          <input id="tpInput" class="field" type="text" data-i18n-ph="todoPh" autocomplete="off" spellcheck="false">
        </div>
        <div class="tp-list" id="tpList"></div>
        <div class="tp-empty" id="tpEmpty" data-i18n="todoEmpty">まだ何もありません</div>
      </div>

      <div class="panel" id="tmpanel" hidden>
        <div class="tp-add">
          <input id="tmInput" class="field" type="text" data-i18n-ph="timerPh" autocomplete="off" spellcheck="false">
        </div>
        <div class="tp-list" id="tmList"></div>
        <div class="tp-empty" id="tmEmpty" data-i18n="timerEmpty">タイマーがありません</div>
      </div>

      <div class="res-foot" id="rfoot"></div>
    </div>
  </div>

  <div id="alts"></div>

  <div id="settings" class="box drawer" hidden>
    <div class="set-row">
      <span class="set-k" data-i18n="setTheme">テーマ</span>
      <div class="seg" data-set="theme">
        <button type="button" data-v="auto" data-i18n="auto">自動</button>
        <button type="button" data-v="light" data-i18n="light">ライト</button>
        <button type="button" data-v="dark" data-i18n="dark">ダーク</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-k" data-i18n="setLang">言語</span>
      <div class="seg" data-set="lang">
        <button type="button" data-v="auto" data-i18n="auto">自動</button>
        <button type="button" data-v="ja">日本語</button>
        <button type="button" data-v="en">English</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-k" data-i18n="setAccent">テーマカラー</span>
      <div class="acc-list" id="accList"></div>
    </div>
    <div class="set-note" id="setNote"></div>
  </div>

  <div id="hints" class="drawer" hidden></div>

  <div id="histwrap" hidden>
    <div class="hist-head">
      <div class="hist-title" data-i18n="bookmarks">ブックマーク</div>
      <button id="clear" type="button" data-i18n="clearAll">全部消去</button>
    </div>
    <ul id="hist"></ul>
  </div>

  <footer>© 2026 Super Hiko14</footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
