<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポリゴンアート — Super Hiko14</title>
<meta name="description" content="画像をポリゴンアート風に変換するツール。PNG・WebP・JPG・SVG で保存できます。">
<link rel="canonical" href="https://super-hiko14.com/monooki/polygon/">
<meta name="theme-color" content="#dcede1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Super Hiko14">
<meta property="og:title" content="ポリゴンアート — Super Hiko14">
<meta property="og:description" content="画像をポリゴンアート風に変換するツール。PNG・WebP・JPG・SVG で保存できます。">
<meta property="og:url" content="https://super-hiko14.com/monooki/polygon/">
<meta property="og:image" content="https://super-hiko14.com/sozai/images/eee.png">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="/sozai/site.css">
<style>
/* ---------- このツールだけの見た目(色・角は site.css と同じ) ---------- */
.tool .field{margin-bottom:22px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:1em;margin-bottom:6px}
.row > span,.row > label{font-size:16px}
.val{color:var(--line);font-size:18px}

/* 画像を置くところ */
.drop{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;
  padding:1.8rem 1rem;cursor:pointer;text-align:center;
  border:3px dashed var(--line);background:var(--hover);
  transition:background-color .15s ease,border-color .15s ease;
}
.drop:hover,.drop.dragover,.drop:focus-within{background:var(--paper);border-color:var(--ink)}
.drop b{font-weight:normal;font-size:18px}
.drop small{color:var(--line);font-size:13px}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* スライダー(四角いつまみ) */
input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;background:transparent;cursor:pointer}
input[type="range"]:focus{outline:none}
input[type="range"]::-webkit-slider-runnable-track{height:6px;background:var(--soft);box-shadow:inset 0 0 0 2px var(--line)}
input[type="range"]::-moz-range-track{height:6px;background:var(--soft);box-shadow:inset 0 0 0 2px var(--line)}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;background:var(--paper);border:3px solid var(--ink);border-radius:0}
input[type="range"]::-moz-range-thumb{width:18px;height:18px;background:var(--paper);border:3px solid var(--ink);border-radius:0;box-sizing:border-box}
input[type="range"]:focus-visible::-webkit-slider-thumb{background:var(--hover)}
input[type="range"]:focus-visible::-moz-range-thumb{background:var(--hover)}
.hints{display:flex;justify-content:space-between;color:var(--line);font-size:13px}

/* 解像度 */
.reso{gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.reso label{flex:1;min-width:7em;display:flex;align-items:center;gap:.4em;color:var(--line)}
.reso .input{padding:.35em .5em}

.go{display:flex;justify-content:center;margin:6px 0 0}
.go .chip{font-size:20px;padding:calc(.4rem + var(--p)) calc(1.6rem + var(--p))}

/* できあがり */
.preview{margin-top:20px;padding:3px;background:var(--line)}
#artCanvas{display:block;width:100%;height:auto;background:var(--paper)}

.save{display:flex;flex-wrap:wrap;gap:8px}
.tool .status{margin:12px 0 0;text-align:center}
.tool .status:empty{margin:0}
</style>
</head>
<body>
<div class="page">
  <div class="top"><a class="chip back" href="/monooki/">‹ 物置場</a></div>

  <header class="head">
    <img src="/sozai/images/eee.png" alt="" width="72" height="72">
    <div>
      <p class="eyebrow">super-hiko14.com/monooki/polygon</p>
      <h1>ポリゴンアート</h1>
    </div>
  </header>

  <section class="card">
    <p class="lead">画像をポリゴンアート風に変換します。背景に納得しないとき、お洒落にするためにどうぞ。</p>
    <p class="note">画像はこのブラウザの中だけで処理されます。どこにも送信されません。</p>
  </section>

  <div class="card tool">
    <div class="field">
      <div class="row"><span>画像</span></div>
      <label for="imageUpload" class="drop upload-area">
        <b>画像をえらぶ</b>
        <small>クリック・ドラッグ＆ドロップ・貼り付け(Ctrl+V)</small>
        <input type="file" id="imageUpload" accept="image/*">
      </label>
    </div>

    <div class="field">
      <div class="row">
        <label for="pointCount">こまかさ</label>
        <span class="val" id="pointCountDisplay">500</span>
      </div>
      <input type="range" id="pointCount" min="100" max="2000" value="500" step="50">
      <div class="hints"><span>あらい</span><span>こまかい</span></div>
    </div>

    <div class="field">
      <div class="row">
        <span>解像度</span>
        <span class="val" id="resolutionDisplay">- px</span>
      </div>
      <button id="toggleResolutionButton" class="chip back" type="button" aria-controls="resolutionInputArea" aria-expanded="false" disabled>解像度をかえる</button>
      <div id="resolutionInputArea" class="reso" style="display:none">
        <label>W <input class="input" type="number" id="newWidthInput" min="50" max="10000" placeholder="幅"></label>
        <label>H <input class="input" type="number" id="newHeightInput" min="50" max="10000" placeholder="高さ"></label>
        <button id="applyResolutionButton" class="chip" type="button">適用</button>
      </div>
    </div>

    <div class="go"><button id="generateButton" class="chip" type="button" disabled>つくる ›</button></div>

    <div class="preview"><canvas id="artCanvas" width="800" height="450"></canvas></div>
    <p class="status" id="messageBox" role="status" aria-live="polite"></p>
  </div>

  <h2 class="section-title">保存する</h2>
  <div class="card tool">
    <label class="field">
      <span>ファイル名</span>
      <input class="input" type="text" id="fileNameInput" placeholder="Polygon(省略可)">
    </label>
    <div class="save">
      <button id="downloadPngButton"  class="chip" type="button" disabled>PNG</button>
      <button id="downloadWebpButton" class="chip" type="button" disabled>WebP</button>
      <button id="downloadJpgButton"  class="chip" type="button" disabled>JPG</button>
      <button id="downloadSvgButton"  class="chip" type="button" disabled>SVG</button>
    </div>
  </div>
</div>

<footer class="foot">
  <span>&copy; 高級ジェネ™</span>
  <a href="/terms/">利用規約</a>
  <a href="/privacypolicy/">プライバシーポリシー</a>
</footer>

<script type="module">
    import { Delaunay } from "https://cdn.jsdelivr.net/npm/d3-delaunay@6/+esm";

    let currentImage = null;
    let aspectRatio = 16 / 9;
    let lastPoints = null;
    let lastColors = null;
    let lastVoronoi = null;

    const canvas            = document.getElementById('artCanvas');
    const ctx               = canvas.getContext('2d', { willReadFrequently: true });
    const imageUpload       = document.getElementById('imageUpload');
    const pointCountInput   = document.getElementById('pointCount');
    const pointCountDisplay = document.getElementById('pointCountDisplay');
    const generateButton    = document.getElementById('generateButton');
    const downloadPngButton = document.getElementById('downloadPngButton');
    const downloadWebpButton= document.getElementById('downloadWebpButton');
    const downloadJpgButton = document.getElementById('downloadJpgButton');
    const downloadSvgButton = document.getElementById('downloadSvgButton');
    const fileNameInput     = document.getElementById('fileNameInput');
    const messageBox        = document.getElementById('messageBox');
    
    const resolutionDisplay      = document.getElementById('resolutionDisplay');
    const toggleResolutionButton = document.getElementById('toggleResolutionButton');
    const resolutionInputArea    = document.getElementById('resolutionInputArea');
    const newWidthInput          = document.getElementById('newWidthInput');
    const newHeightInput          = document.getElementById('newHeightInput');
    const applyResolutionButton  = document.getElementById('applyResolutionButton');
    const uploadArea             = document.querySelector('.upload-area');

    function handleImageLoaded(img) {
        currentImage = img;
        aspectRatio = img.height / img.width;
        
        const w = img.width;
        const h = img.height;
        
        canvas.width = w;
        canvas.height = h;
        ctx.drawImage(img, 0, 0, w, h);
        
        resolutionDisplay.textContent = `${w} × ${h} px`;
        newWidthInput.value = w;
        newHeightInput.value = h;
        
        toggleResolutionButton.disabled = false;
        generateButton.disabled = false;
        setDownloadButtonsDisabled(true);
    }

    function loadPlaceholderImage() {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
            handleImageLoaded(img);
        };
        img.onerror = () => showMessage('プレースホルダーの読み込みに失敗しました。', 'error');
        img.src = "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=450&fit=crop";
    }

    function showMessage(msg, type = 'info') {
        messageBox.textContent = msg;
        messageBox.className = 'status ' + (type === 'error' ? 'ng' : 'ok');
                clearTimeout(showMessage.t);
        showMessage.t = setTimeout(() => { messageBox.textContent = ''; }, 4000);
    }

    function downloadArt(mimeType, extension, quality = 1.0) {
        let baseName = fileNameInput.value.trim().replace(/[^a-zA-Z0-9_\-あ-ん]/g, '_') || 'Polygon';
        const dataURL = canvas.toDataURL(mimeType, quality);
        const a = document.createElement('a');
        a.href = dataURL;
        a.download = `${baseName}.${extension}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showMessage(`${extension.toUpperCase()} でダウンロードしました — ${baseName}.${extension}`, 'success');
    }

    function downloadSvg() {
        if (!lastPoints) return;
        const width = canvas.width;
        const height = canvas.height;
        let baseName = fileNameInput.value.trim().replace(/[^a-zA-Z0-9_\-あ-ん]/g, '_') || 'Polygon';
        
        const delaunay = Delaunay.from(lastPoints.map(p => [p.x, p.y]));
        const voronoi = delaunay.voronoi([0, 0, width, height]);
        
        let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}">\n`;
        svgContent += `  <rect width="${width}" height="${height}" fill="black" />\n`;
        
        for (let i = 0; i < lastPoints.length; i++) {
            const cell = voronoi.cellPolygon(i);
            if (!cell) continue;
            
            // 面積を計算（極細・極小セルの検出用）
            let area = 0;
            for (let j = 0; j < cell.length; j++) {
                const next = (j + 1) % cell.length;
                area += cell[j][0] * cell[next][1] - cell[next][0] * cell[j][1];
            }
            area = Math.abs(area) / 2;
            
            // 面積が極小のポリゴンは枠線を極細にして目立たなくする
            const strokeWidth = area < 16 ? "0.1" : "1.2";
            
            const p = lastPoints[i];
            const colorStr = `rgb(${p.r},${p.g},${p.b})`;
            const pointsStr = cell.map(pt => `${pt[0].toFixed(1)},${pt[1].toFixed(1)}`).join(' ');
            svgContent += `  <polygon points="${pointsStr}" fill="${colorStr}" stroke="${colorStr}" stroke-width="${strokeWidth}" stroke-linejoin="round" />\n`;
        }
        svgContent += `</svg>`;
        
        const blob = new Blob([svgContent], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${baseName}.svg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        showMessage(`SVG でダウンロードしました — ${baseName}.svg`, 'success');
    }

    function setDownloadButtonsDisabled(disabled) {
        downloadPngButton.disabled  = disabled;
        downloadWebpButton.disabled = disabled;
        downloadJpgButton.disabled  = disabled;
        downloadSvgButton.disabled  = disabled;
    }

    function loadImageFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                handleImageLoaded(img);
                showMessage('画像を読み込みました', 'success');
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    ['dragenter', 'dragover'].forEach(eventName => {
        uploadArea.addEventListener(eventName, (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        uploadArea.addEventListener(eventName, (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
        }, false);
    });

    uploadArea.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length > 0) {
            const file = files[0];
            if (file.type.startsWith('image/')) {
                loadImageFile(file);
            } else {
                showMessage('画像ファイルを選択してください', 'error');
            }
        }
    });

    imageUpload.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        loadImageFile(file);
    });

    window.addEventListener('paste', (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) {
                const file = items[i].getAsFile();
                loadImageFile(file);
                break;
            }
        }
    });

    pointCountInput.addEventListener('input', () => {
        pointCountDisplay.textContent = pointCountInput.value;
    });

    toggleResolutionButton.addEventListener('click', () => {
        const isHidden = resolutionInputArea.style.display === 'none';
        resolutionInputArea.style.display = isHidden ? 'flex' : 'none';
        toggleResolutionButton.setAttribute('aria-expanded', String(isHidden));
        if (isHidden) {
            newWidthInput.value = canvas.width;
            newHeightInput.value = canvas.height;
        }
    });

    newWidthInput.addEventListener('input', () => {
        const w = parseInt(newWidthInput.value);
        if (!isNaN(w) && w > 0) {
            newHeightInput.value = Math.round(w * aspectRatio);
        } else {
            newHeightInput.value = '';
        }
    });

    newHeightInput.addEventListener('input', () => {
        const h = parseInt(newHeightInput.value);
        if (!isNaN(h) && h > 0) {
            newWidthInput.value = Math.round(h / aspectRatio);
        } else {
            newWidthInput.value = '';
        }
    });

    applyResolutionButton.addEventListener('click', () => {
        const w = parseInt(newWidthInput.value);
        const h = parseInt(newHeightInput.value);
        if (isNaN(w) || w <= 0 || isNaN(h) || h <= 0) {
            showMessage('有効な解像度を入力してください', 'error');
            return;
        }
        
        canvas.width = w;
        canvas.height = h;
        ctx.drawImage(currentImage, 0, 0, w, h);
        
        resolutionDisplay.textContent = `${w} × ${h} px`;
        resolutionInputArea.style.display = 'none';
        
        setDownloadButtonsDisabled(true);
        showMessage(`解像度を ${w} × ${h} px に変更しました`, 'success');
    });

    generateButton.addEventListener('click', () => {
        if (!currentImage) { showMessage('画像をアップロードしてください', 'error'); return; }
        generateButton.disabled = true;
        generateButton.textContent = '処理中…';
        setDownloadButtonsDisabled(true);

        setTimeout(() => {
            try {
                ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                const width = canvas.width, height = canvas.height;
                const pointCount = parseInt(pointCountInput.value);

                const points = [];
                for (let i = 0; i < pointCount; i++)
                    points.push({ x: Math.random() * width, y: Math.random() * height, r: 0, g: 0, b: 0, count: 0 });

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const index = (y * width + x) * 4;
                        const r = data[index], g = data[index + 1], b = data[index + 2];
                        let minDistSq = Infinity, nearest = -1;
                        for (let i = 0; i < pointCount; i++) {
                            const p = points[i];
                            const d = (x - p.x) ** 2 + (y - p.y) ** 2;
                            if (d < minDistSq) { minDistSq = d; nearest = i; }
                        }
                        if (nearest !== -1) { const p = points[nearest]; p.r += r; p.g += g; p.b += b; p.count++; }
                    }
                }

                points.forEach(p => {
                    if (p.count > 0) { p.r = Math.floor(p.r / p.count); p.g = Math.floor(p.g / p.count); p.b = Math.floor(p.b / p.count); }
                });

                const outputData = new Uint8ClampedArray(data.length);
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const index = (y * width + x) * 4;
                        let minDistSq = Infinity, nearest = -1;
                        for (let i = 0; i < pointCount; i++) {
                            const p = points[i];
                            const d = (x - p.x) ** 2 + (y - p.y) ** 2;
                            if (d < minDistSq) { minDistSq = d; nearest = i; }
                        }
                        if (nearest !== -1) {
                            const p = points[nearest];
                            outputData[index] = p.r; outputData[index + 1] = p.g;
                            outputData[index + 2] = p.b; outputData[index + 3] = 255;
                        }
                    }
                }

                ctx.putImageData(new ImageData(outputData, width, height), 0, 0);

                lastPoints = points;

                showMessage('生成が完了しました', 'success');
                setDownloadButtonsDisabled(false);
            } catch (e) {
                console.error(e);
                showMessage('生成中にエラーが発生しました', 'error');
            } finally {
                generateButton.disabled = false;
                generateButton.textContent = 'つくる ›';
            }
        }, 50);
    });

    downloadPngButton.addEventListener('click',  () => { if (!downloadPngButton.disabled)  downloadArt('image/png',  'png'); });
    downloadWebpButton.addEventListener('click', () => { if (!downloadWebpButton.disabled) downloadArt('image/webp', 'webp', 0.9); });
    downloadJpgButton.addEventListener('click',  () => { if (!downloadJpgButton.disabled)  downloadArt('image/jpeg', 'jpg',  0.9); });
    downloadSvgButton.addEventListener('click',  () => { if (!downloadSvgButton.disabled)  downloadSvg(); });

    window.onload = () => {
        loadPlaceholderImage();
        generateButton.disabled = true;
        pointCountInput.value = 500;
        pointCountDisplay.textContent = 500;
    };
</script>
</body>
</html>
