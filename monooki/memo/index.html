<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>文綴</title>
<meta name="description" content="ブラウザだけで使える、フォントを着せかえられる書きもの帳。">
<meta name="theme-color" content="#fbfbfa">
<link rel="icon" type="image/png" href="memo_icons.png">
<link rel="apple-touch-icon" href="memo_icons.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
/* テーマはちらつかないよう最初に決める */
(function () {
  var s = {}; try { s = JSON.parse(localStorage.getItem('fontion_settings_v8')) || {}; } catch (e) {}
  var d = typeof s.dark === 'boolean' ? s.dark : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = d ? 'dark' : 'light';
})();
</script>
<style>
@font-face{font-family:"MaruMinya";src:url(/sozai/fonts/x12y12pxMaruMinya.ttf) format("truetype");font-display:swap}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fbfbfa;--side:#f3f3f1;--ink:#1f1f1e;--sub:#8b8b87;--line:#e5e5e2;--hover:rgba(0,0,0,.045);--on:rgba(0,0,0,.085);--shade:rgba(0,0,0,.3);--soft-shadow:rgba(0,0,0,.08);
  --danger:#d2463c;
  --sys:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  --ui:var(--sys);
  --side-w:260px;--ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1a1a1a;--side:#212121;--ink:#e9e9e7;--sub:#8e8e8a;--line:#2f2f2f;--hover:rgba(255,255,255,.06);--on:rgba(255,255,255,.11);--shade:rgba(0,0,0,.55);--soft-shadow:rgba(0,0,0,.4);
  --danger:#e0645a;color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font:15px/1.6 var(--ui);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block;flex:none}
::selection{background:var(--on)}
:focus-visible{outline:2px solid var(--sub);outline-offset:1px}

#app{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;overflow:hidden}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--sub);flex:none;transition:background .12s,color .12s}
.ib:hover{background:var(--hover);color:var(--ink)}

/* ── sidebar ── */
#side{width:var(--side-w);flex:none;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--line);transition:margin .28s var(--ease)}
body.side-closed #side{margin-left:calc(-1 * var(--side-w) - 1px)}
.side-head{display:flex;align-items:center;gap:6px;padding:12px 10px 8px 16px}
.logo{flex:1;font-size:16px;font-weight:600;letter-spacing:.04em}
.search{margin:0 10px 6px;position:relative;display:block}
#search{width:100%;height:34px;padding:0 10px 0 32px;border:1px solid transparent;border-radius:8px;background:var(--hover);color:var(--ink);font:14px var(--ui);outline:none}
#search:focus{border-color:var(--line);background:var(--bg)}
#search::placeholder{color:var(--sub)}
#search::-webkit-search-cancel-button{display:none}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
#list{flex:1;overflow-y:auto;padding:2px 8px 10px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior:contain}
.row{position:relative;margin-bottom:2px;border-radius:9px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.item{position:relative;z-index:1;padding:8px 34px 8px 10px;border-radius:9px;background:var(--side);cursor:pointer;transition:background .12s}
.row:not(.open) .item:hover{background:linear-gradient(var(--hover),var(--hover)),var(--side)}
.row.active .item{background:linear-gradient(var(--on),var(--on)),var(--side)}
.item-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.untitled .item-title{color:var(--sub)}
.item-sub{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-del{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--sub);opacity:0;transition:opacity .12s,color .12s,background .12s}
.row:hover .item-del{opacity:1}
.item-del:hover{color:var(--danger);background:var(--on)}
.swipe-del{position:absolute;right:0;top:0;bottom:0;width:84px;background:var(--danger);color:#fff;font-size:14px;opacity:0}
.row.swiping .swipe-del,.row.open .swipe-del{opacity:1}
.row.slide .item{transition:transform .25s var(--ease),background .12s}
/* 並べ替え */
#list.dragging .row{transition:transform .2s var(--ease)}
#list.dragging .row.lifted{transition:none;z-index:5;overflow:visible}
.row.lifted .item{background:var(--bg);box-shadow:0 6px 20px var(--shade);transform:scale(1.02)}
#list.dragging .item-del{opacity:0}
.empty-list{padding:24px 8px;text-align:center;font-size:13px;color:var(--sub)}
.side-foot{display:flex;align-items:center;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#count{flex:1;font-size:12px;color:var(--sub);padding-left:8px}
#scrim{display:none}

/* ── main ── */
#main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
#topbar{height:50px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid transparent;transition:border-color .2s}
#topbar.lined{border-color:var(--line)}
.grow{flex:1}
#saved{width:6px;height:6px;border-radius:50%;background:transparent;margin:0 6px;flex:none;transition:background .2s}
#saved.saving{background:var(--sub)}
#saved.error{background:var(--danger)}
#font-btn{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;max-width:210px;flex:none;transition:background .12s}
#font-btn:hover{background:var(--hover)}
#font-btn b{font-size:15px;font-weight:normal}
#font-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}

#scroll{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior:contain}
#paper{position:relative;max-width:740px;margin:0 auto;padding:44px 48px 40vh}
#title{display:block;width:100%;border:0;background:none;resize:none;outline:none;overflow:hidden;color:var(--ink);font-size:30px;font-weight:700;line-height:1.35}
#title::placeholder{color:var(--sub);opacity:.6}
#meta{margin:8px 0 26px;font-size:12px;color:var(--sub);font-family:var(--ui)}

/* ── editor ── */
#area{position:relative;outline:none;font-size:17px;line-height:1.85;min-height:40vh;word-break:break-word;overflow-wrap:anywhere}
#area.empty::before{content:'ここから書きはじめる…';position:absolute;top:0;left:0;color:var(--sub);opacity:.7;pointer-events:none}
#area h1,#area h2{font-weight:700;line-height:1.45}
#area h1{font-size:1.55em;margin:.9em 0 .3em}
#area h2{font-size:1.25em;margin:.8em 0 .2em}
#area>:first-child{margin-top:0}
#area blockquote{margin:.4em 0;padding:.1em 0 .1em 1em;border-left:3px solid var(--line);color:var(--sub)}
#area ul,#area ol{padding-left:1.5em;margin:.1em 0}
#area li::marker{color:var(--sub)}
#area hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
#area a{color:inherit}

/* ── 書式バー ── */
#toolbar{display:flex;align-items:center;gap:1px}
.tb{min-width:30px;height:30px;padding:0 5px;flex:none;display:grid;place-items:center;border-radius:15px;color:var(--sub);font:600 13px/1 var(--sys);touch-action:manipulation;transition:background .12s,color .12s}
.tb:hover{background:var(--hover);color:var(--ink)}
.tb.on{background:var(--on);color:var(--ink)}
.tb-sep{width:1px;height:14px;background:var(--line);margin:0 3px;flex:none}
/* PC: カーソルの横についてくる丸ボタン → 押すと書式バーに広がる */
#fbar{position:absolute;z-index:20;left:0;top:0;display:none;align-items:center;height:34px;padding:2px;border-radius:17px;background:var(--bg);border:1px solid var(--line);box-shadow:0 2px 10px var(--soft-shadow);user-select:none;-webkit-user-select:none}
#fbar.show{display:flex;animation:fin .16s var(--ease)}
#fb-tg{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;color:var(--sub);flex:none;transition:background .12s,color .12s}
#fb-tg:hover{background:var(--hover);color:var(--ink)}
#fb-tg svg{transition:transform .2s var(--ease)}
#fbar.open #fb-tg svg{transform:rotate(180deg)}
#fbar:not(.open) #toolbar{display:none}
#fbar.open #toolbar{animation:grow .2s var(--ease);transform-origin:left center}
@keyframes fin{from{opacity:0}}
@keyframes grow{from{opacity:0;transform:scaleX(.6)}}

/* ── popover menu ── */
#menu{position:fixed;z-index:60;min-width:200px;padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px var(--shade);display:none}
#menu.open{display:block;animation:pop .14s var(--ease)}
.mi{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:8px 12px;border-radius:7px;font-size:14px;text-align:left}
.mi:hover{background:var(--hover)}
.mi .k{color:var(--sub);font-size:12px}
.mi.danger{color:var(--danger)}
.mi.back{color:var(--sub);justify-content:flex-start}
.mi-sep{height:1px;margin:5px 6px;background:var(--line)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}

/* ── sheet ── */
#sheet-wrap{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center}
#sheet-wrap.open{display:flex}
#sheet-scrim{position:absolute;inset:0;background:var(--shade);animation:fade .2s}
#sheet{position:relative;width:min(480px,calc(100% - 32px));max-height:min(720px,86%);display:flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 48px var(--shade);animation:rise .25s var(--ease);overflow:hidden}
#sheet-body{flex:1;overflow-y:auto;padding:22px 22px 20px;scrollbar-width:thin}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
#sheet h3{font-size:17px;margin-bottom:6px}
.lead{font-size:13px;color:var(--sub)}
.lead a{color:inherit}
.sec{font-size:12px;color:var(--sub);margin:18px 0 6px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.acts.left{justify-content:flex-start;margin-top:8px}
.btn{height:36px;padding:0 16px;border-radius:8px;border:1px solid var(--line);font-size:14px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;padding:3px;gap:2px;border-radius:10px;background:var(--hover)}
.seg button{flex:1;height:32px;border-radius:8px;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px var(--soft-shadow)}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:6px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.pick:hover{background:var(--hover)}
.pick span{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-in{display:flex;gap:6px;margin-top:14px}
.input{flex:1;min-width:0;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:15px var(--ui);outline:none}
.input:focus{border-color:var(--sub)}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fo{position:relative;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-align:left;min-width:0}
.fo:hover{background:var(--hover)}
.fo.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fo .s{font-size:19px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fo .n{font:11px var(--sys);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fo .x{position:absolute;right:4px;top:4px;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--sub);font:13px/1 var(--sys)}
.fo .x:hover{background:var(--on);color:var(--danger)}
.help{font-size:13px;color:var(--sub);line-height:1.9}
.help code{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--hover);padding:1px 5px;border-radius:4px;color:var(--ink)}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,10px);z-index:80;display:flex;align-items:center;gap:14px;padding:9px 16px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto}
#toast button{font-weight:600;color:var(--bg);text-decoration:underline;text-underline-offset:3px}

/* ── mobile ── */
@media (max-width:760px){
  :root{--dw:min(84vw,320px)}
  /* X みたいに、メイン画面ごと横へずれて一覧が出てくる */
  #side{position:fixed;left:0;top:0;bottom:0;z-index:50;width:var(--dw);margin:0!important;transform:translateX(-100%);transition:transform .32s var(--ease)}
  #main{transition:transform .32s var(--ease)}
  body.drawer #side{transform:none}
  body.drawer #main{transform:translateX(var(--dw))}
  #scrim{display:block;position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .32s}
  body.drawer #scrim{opacity:1;pointer-events:auto}
  body.swiping #side,body.swiping #main,body.swiping #scrim{transition:none}
  #search{font-size:16px}
  .item-del{display:none}
  .item{padding-right:10px}
  #topbar{padding:0 6px}
  #font-btn{max-width:150px}
  #fbar{display:none!important}
  /* 書式バーはキーボードのすぐ上 (#main の一番下) に常に出す */
  #toolbar{flex:none;justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
  body.kb #toolbar{padding-bottom:4px}
  .tb{flex:1 1 0;min-width:0;height:40px;font-size:15px;border-radius:8px}
  .tb-sep{display:none}
  #paper{padding:20px 20px 30vh}
  #title{font-size:25px}
  #sheet-wrap{align-items:flex-end}
  #sheet{width:100%;max-height:88%;border-radius:16px 16px 0 0;border-bottom:0}
  #sheet-body{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .input{font-size:16px}
  #toast{bottom:calc(64px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="メモ一覧">
    <div class="side-head">
      <div class="logo">文綴</div>
      <button class="ib" id="new-btn" title="新しいメモ (Ctrl+Alt+N)"></button>
    </div>
    <label class="search"><span id="search-ic"></span><input id="search" type="search" placeholder="検索" autocomplete="off"></label>
    <div id="list"></div>
    <div class="side-foot">
      <span id="count"></span>
      <button class="ib" id="settings-btn" title="設定"></button>
    </div>
  </aside>
  <div id="scrim"></div>

  <main id="main">
    <header id="topbar">
      <button class="ib" id="side-btn" title="メモ一覧"></button>
      <span class="grow"></span>
      <span id="saved" title="保存済み"></span>
      <button id="font-btn" title="このメモのフォント"><b>Aa</b><span></span></button>
      <button class="ib" id="more-btn" title="このメモ"></button>
    </header>
    <div id="scroll">
      <div id="paper">
        <textarea id="title" rows="1" placeholder="無題" spellcheck="false"></textarea>
        <div id="meta"></div>
        <div id="area" contenteditable="true" spellcheck="false"></div>
        <div id="fbar"><button id="fb-tg" title="書式"></button></div>
      </div>
    </div>
  </main>
</div>

<div id="toolbar" role="toolbar" aria-label="書式">
  <button class="tb" data-cmd="bold" title="太字　Ctrl+B / **"><b>B</b></button>
  <button class="tb" data-cmd="italic" title="斜体　Ctrl+I / *文字*"><i style="font-family:Georgia,serif">I</i></button>
  <button class="tb" data-cmd="underline" title="下線　Ctrl+U / __"><u>U</u></button>
  <button class="tb" data-cmd="strikeThrough" title="取り消し線　~~"><s>S</s></button>
  <span class="tb-sep"></span>
  <button class="tb" data-cmd="h1" title="見出し　# ">H1</button>
  <button class="tb" data-cmd="h2" title="小見出し　## ">H2</button>
  <span class="tb-sep"></span>
  <button class="tb" data-cmd="ul" title="リスト　- "></button>
  <button class="tb" data-cmd="ol" title="番号リスト　1. "></button>
  <button class="tb" data-cmd="blockquote" title="引用　> "></button>
</div>
<div id="menu" role="menu"></div>
<div id="sheet-wrap"><div id="sheet-scrim"></div><div id="sheet" role="dialog" aria-modal="true"><div id="sheet-body"></div></div></div>
<div id="toast" role="status"></div>
<input type="file" id="file-in" accept="application/json,.json" hidden>

<script>
'use strict';
/* ═══════════ constants ═══════════ */
const SK_PAGES = 'fontion_pages_v8', SK_SETTINGS = 'fontion_settings_v8', OLD_PAGES = 'fontion_pages_v7';
const DEFAULT_FONT = 'Noto Sans JP';
const SAMPLE = 'あ永 文綴 Aa';
const FONT_GROUPS = [
  ['ゴシック', ['Noto Sans JP', 'M PLUS 2', 'Zen Kaku Gothic New', 'BIZ UDPGothic', 'IBM Plex Sans JP', 'Sawarabi Gothic']],
  ['明朝', ['Noto Serif JP', 'Shippori Mincho', 'Zen Old Mincho', 'BIZ UDPMincho', 'Kaisei Opti', 'Sawarabi Mincho']],
  ['まる', ['Zen Maru Gothic', 'M PLUS Rounded 1c', 'Kiwi Maru', 'Kosugi Maru']],
  ['手書き・筆', ['Klee One', 'Yomogi', 'Zen Kurenaido', 'Yuji Syuku', 'Hachi Maru Pop', 'Yusei Magic']],
  ['ポップ・ドット', ['MaruMinya', 'DotGothic16', 'RocknRoll One', 'Mochiy Pop One', 'Dela Gothic One', 'Reggae One']],
];
const PRESETS = FONT_GROUPS.flatMap(g => g[1]);
const LOCAL_FONTS = new Set(['MaruMinya']);
const UI_MEMO = '@memo';
const BLOCK_TAGS = new Set(['DIV','P','H1','H2','H3','H4','H5','H6','BLOCKQUOTE','UL','OL','LI','PRE','HR','TABLE']);
const ZW = '​';

const $ = s => document.querySelector(s);
const ic = (d, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  side: ic('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>'),
  plus: ic('<path d="M12 5v14M5 12h14"/>'),
  search: ic('<circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/>', 15),
  more: ic('<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'),
  gear: ic('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),

  openSheet(`<h3>書き方のヒント</h3>

    <code># </code> 見出し　<code>## </code> 小見出し　<code>- </code> リスト　<code>1. </code> 番号　<code>&gt; </code> 引用　<code>---</code> 区切り線<br>
    → 見出しやリストの中で同じ記号をもう一度打つと解除。行頭で Backspace でも解除。</p>
    <p class="help" style="margin-top:10px">文の途中で打つ<br>
    <code>**</code> 太字　<code>~~</code> 取り消し線　<code>__</code> 下線　<code>*文字*</code> 斜体<br>
    → 一度打つとその書式で書きはじめ、もう一度打つと解除。全角の <code>＊＊</code> <code>～～</code> でもOK。</p>
    <p class="help" style="margin-top:10px">一覧のメモはドラッグで並べ替え (スマホは長押ししてから)。スマホは左へスワイプで削除、画面を右へスワイプで一覧。</p>
    <p class="help" style="margin-top:10px">Ctrl+B / I / U 書式　Ctrl+D ライト/ダーク　Ctrl+S 保存　Ctrl+Alt+N 新しいメモ</p>
    <div class="acts"><button class="btn primary" data-close>閉じる</button></div>`);
}

function openSettings() {
  closeDrawer();
  const uiMode = !settings.uiFont ? 'sys' : settings.uiFont === UI_MEMO ? 'memo' : 'pick';
  openSheet(`<h3>設定</h3>
    <div class="sec">テーマ</div>
    <div class="seg" id="s-theme"><button data-v="light">ライト</button><button data-v="dark">ダーク</button></div>
    <div class="sec">画面の文字 (一覧やメニュー)</div>
    <div class="seg" id="s-ui"><button data-v="sys">標準</button><button data-v="memo">メモと同じ</button><button data-v="pick">好きなフォント</button></div>
    <button class="pick" id="s-ui-pick" ${uiMode === 'pick' ? '' : 'hidden'}><b style="font-weight:normal">フォントを選ぶ</b><span></span></button>
    <div class="sec">バックアップ</div>
    <p class="lead">メモはこのブラウザの中にだけ保存されています。ブラウザのデータを消したり別の端末で開いたりすると見られないので、ときどき書き出しておくと安心です。</p>
    <div class="acts left"><button class="btn" id="bk-save">書き出す</button><button class="btn" id="bk-load">読み込む</button></div>
    <div class="acts"><button class="btn primary" data-close>閉じる</button></div>`, s => {
    const mark = (id, v) => s.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === v));
    mark('s-theme', isDark() ? 'dark' : 'light');
    mark('s-ui', uiMode);
    const pickBtn = s.querySelector('#s-ui-pick');
    pickBtn.querySelector('span').textContent = settings.uiFont && settings.uiFont !== UI_MEMO ? settings.uiFont : '未選択';
    s.querySelectorAll('#s-theme button').forEach(b => b.onclick = () => { setDark(b.dataset.v === 'dark'); mark('s-theme', b.dataset.v); });
    s.querySelectorAll('#s-ui button').forEach(b => b.onclick = () => {
      const v = b.dataset.v;
      mark('s-ui', v);
      pickBtn.hidden = v !== 'pick';
      if (v === 'sys') settings.uiFont = '';
      else if (v === 'memo') settings.uiFont = UI_MEMO;
      else if (!settings.uiFont || settings.uiFont === UI_MEMO) return openFontSheet('ui');
      applyUiFont(); saveSettings();
    });
    pickBtn.onclick = () => openFontSheet('ui');
    s.querySelector('#bk-save').onclick = backup;
    s.querySelector('#bk-load').onclick = () => $('#file-in').click();
  });
}
$('#settings-btn').onclick = openSettings;

/* kind: 'page' = このメモの本文 / 'ui' = 画面の文字 */
function openFontSheet(kind = 'page') {
  const isPage = kind === 'page';
  const p = activePage();
  const cur = () => isPage ? p.font : settings.uiFont;
  PRESETS.forEach(injectFont);
  settings.recentFonts.forEach(injectFont);
  const card = (f, removable) => `<button class="fo ${f === cur() ? 'on' : ''}" data-f="${esc(f)}">
      <span class="s" style="font-family:${esc(fontStack(f))}">${SAMPLE}</span><span class="n">${esc(f)}</span>
      ${removable ? `<span class="x" data-x="${esc(f)}" title="履歴から消す">×</span>` : ''}</button>`;
  const recent = settings.recentFonts.filter(f => !PRESETS.includes(f));
  openSheet(`<h3>${isPage ? 'このメモのフォント' : '画面の文字のフォント'}</h3>
    <p class="lead">タップするとすぐ切り替わります。<a href="https://fonts.google.com/?subset=japanese" target="_blank" rel="noopener">Google Fonts</a> のフォント名を入れて使うこともできます。</p>
    <div class="f-in"><input class="input" id="font-in" autocomplete="off" spellcheck="false" placeholder="フォント名 (例: Kaisei Decol)"><button class="btn" id="font-ok">使う</button></div>
    ${recent.length ? `<div class="sec">最近つかった</div><div class="fonts">${recent.map(f => card(f, true)).join('')}</div>` : ''}
    ${FONT_GROUPS.map(([g, fs]) => `<div class="sec">${g}</div><div class="fonts">${fs.map(f => card(f)).join('')}</div>`).join('')}
    <div class="acts">${isPage ? '' : '<button class="btn" id="font-back">設定にもどる</button>'}<button class="btn primary" data-close>閉じる</button></div>`, s => {
    const inp = s.querySelector('#font-in');
    const apply = name => {
      const f = cleanFont(name);
      if (!f) return toast('フォント名を入れてね');
      injectFont(f);
      if (isPage) { p.font = f; settings.lastFont = f; applyPageFont(); sync(false); }
      else { settings.uiFont = f; applyUiFont(); }
      if (!PRESETS.includes(f)) settings.recentFonts = [f, ...settings.recentFonts.filter(x => x !== f)].slice(0, 8);
      saveSettings();
      s.querySelectorAll('.fo').forEach(b => b.classList.toggle('on', b.dataset.f === f));
      document.fonts && document.fonts.load(`16px '${f}'`, 'あ').then(l => { if (!l.length && !LOCAL_FONTS.has(f)) toast(`「${f}」が見つからないかも…`); }).catch(() => {});
    };
    s.querySelectorAll('.fo').forEach(c => c.onclick = e => {
      const x = e.target.closest('.x');
      if (x) { e.stopPropagation(); settings.recentFonts = settings.recentFonts.filter(f => f !== x.dataset.x); saveSettings(); c.remove(); return; }
      apply(c.dataset.f);
    });
    s.querySelector('#font-ok').onclick = () => { apply(inp.value); inp.value = ''; };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { apply(inp.value); inp.value = ''; } });
    const back = s.querySelector('#font-back');
    if (back) back.onclick = openSettings;
  });
}
$('#font-btn').onclick = () => openFontSheet('page');

/* ═══════════ export / backup ═══════════ */
function toText(html, md) {
  const t = document.createElement('template');
  t.innerHTML = html || '';
  stripZW(t.content);
  const out = [];
  const wrapMd = (s, m) => s.trim() ? m + s + m : s;
  const inline = n => {
    let s = '';
    n.childNodes.forEach(c => {
      if (c.nodeType === 3) s += c.data;
      else if (c.nodeName === 'BR') s += '\n';
      else if (!md) s += (isBlock(c) ? '\n' : '') + inline(c);
      else if (/^(B|STRONG)$/.test(c.nodeName)) s += wrapMd(inline(c), '**');
      else if (/^(I|EM)$/.test(c.nodeName)) s += wrapMd(inline(c), '*');
      else if (/^(S|STRIKE|DEL)$/.test(c.nodeName)) s += wrapMd(inline(c), '~~');
      else s += (isBlock(c) ? '\n' : '') + inline(c);
    });
    return s;
  };
  const line = n => inline(n).replace(/\n$/, '');
  const walk = (node, depth) => {
    node.childNodes.forEach(c => {
      if (c.nodeType === 3) { if (c.data.trim()) out.push(c.data); return; }
      if (c.nodeType !== 1) return;
      const tag = c.nodeName;
      if (/^H[1-6]$/.test(tag)) out.push((md ? '#'.repeat(+tag[1]) + ' ' : '') + line(c).trim());
      else if (tag === 'BLOCKQUOTE') line(c).split('\n').forEach(l => out.push((md ? '> ' : '　') + l));
      else if (tag === 'UL' || tag === 'OL') {
        let i = 1;
        c.childNodes.forEach(li => {
          if (li.nodeName === 'LI') {
            const clone = li.cloneNode(true);
            clone.querySelectorAll('ul,ol').forEach(x => x.remove());
            out.push('  '.repeat(depth) + (tag === 'OL' ? `${i++}. ` : md ? '- ' : '・') + line(clone).trim());
            li.querySelectorAll(':scope > ul, :scope > ol').forEach(sub => walk({ childNodes: [sub] }, depth + 1));
          } else if (li.nodeName === 'UL' || li.nodeName === 'OL') walk({ childNodes: [li] }, depth + 1);
        });
      }
      else if (tag === 'HR') out.push(md ? '---' : '――――');
      else if ([...c.childNodes].some(isBlock)) walk(c, depth);
      else out.push(line(c));
    });
  };
  walk(t.content, 0);
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const safeName = s => (s.trim() || '無題').replace(/[\\/:*?"<>|\n]/g, '_').slice(0, 60);
function exportPage(kind) {
  if (dirty) persist();
  const p = activePage(), md = kind === 'md';
  const head = p.title.trim() ? (md ? '# ' : '') + p.title.trim() + '\n\n' : '';
  download(`${safeName(p.title)}.${md ? 'md' : 'txt'}`, head + toText(p.content, md), md ? 'text/markdown' : 'text/plain');
}
function backup() {
  if (dirty) persist();
  const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  download(`文綴-バックアップ-${stamp}.json`, JSON.stringify({ app: 'fumi', version: 9, exportedAt: d.toISOString(), pages }, null, 1), 'application/json');
  toast('バックアップを書き出しました');
}
$('#file-in').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch { return toast('ファイルを読めませんでした'); }
  const inc = Array.isArray(data) ? data : data && Array.isArray(data.pages) ? data.pages : null;
  if (!inc) return toast('文綴のバックアップではないみたい');
  let added = 0;
  inc.forEach(p => {
    if (!p || typeof p !== 'object') return;
    const content = dropTodos(String(p.content || ''));
    const same = pages.find(x => x.id === p.id);
    if (same && same.content === content && same.title === String(p.title || '')) return;
    pages.push({ id: same ? uid() : String(p.id || uid()), title: String(p.title || ''), content, font: cleanFont(p.font) || DEFAULT_FONT, updatedAt: +p.updatedAt || Date.now() });
    added++;
  });
  persist(); renderList(); closeSheet();
  toast(added ? `${added} 件のメモを読み込みました` : '新しいメモはありませんでした');
});

/* ═══════════ global keys ═══════════ */
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === 'Escape') {
    if (sheetWrap.classList.contains('open')) closeSheet();
    else if (menu.classList.contains('open')) closeMenu();
    else if (openRow) closeSwipe();
    else closeDrawer();
  }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); persist(); toast('保存しました'); }
  if (mod && e.key.toLowerCase() === 'd' && !e.shiftKey) { e.preventDefault(); setDark(!isDark()); }
  if (mod && e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); createPage(); }
});

/* ═══════════ init ═══════════ */
$('#side-btn').innerHTML = ICON.side;
$('#new-btn').innerHTML = ICON.plus;
$('#more-btn').innerHTML = ICON.more;
$('#search-ic').innerHTML = ICON.search;
$('#settings-btn').innerHTML = ICON.gear;
document.body.classList.toggle('side-closed', !!settings.sideClosed);
placeToolbar();
applyTheme();
applyUiFont();
loadPage();
renderList();
if (migrated) persist();
</script>
