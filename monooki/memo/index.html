<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>文綴</title>
<meta name="description" content="ブラウザだけで使える、しずかな書きもの帳。見出し・リスト・Todo・ページごとのフォント。">
<meta name="theme-color" content="#F2F0ED">
<link rel="icon" type="image/png" href="memo_icons.png">
<link rel="apple-touch-icon" href="memo_icons.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"MaruMinya";src:url(/sozai/fonts/x12y12pxMaruMinya.ttf) format("truetype");font-display:swap}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pixel:"MaruMinya","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --ui:var(--pixel);
  --side-w:288px; --gap:12px; --kb:0px;
  --ease:cubic-bezier(.16,.9,.3,1);
  --danger:#B8474A;
}
/* ── themes: super-hiko14.com のミントが基本 ── */
body[data-theme="parchment"]{--bg:#dcede1;--paper:#fbfcfa;--ink:#1c231e;--line:#607363;--hover:#eaf3ec;--soft:#c5ddcc}
body[data-theme="moss"]     {--bg:#efeac4;--paper:#fdfcf3;--ink:#24221a;--line:#7a7350;--hover:#f6f2da;--soft:#e2daa5}
body[data-theme="rose"]     {--bg:#f2dde2;--paper:#fdf9fa;--ink:#2a1d21;--line:#8a6670;--hover:#f8ebee;--soft:#e7c4cc}
body[data-theme="slate"]    {--bg:#d8e6f2;--paper:#fafcfd;--ink:#1a2129;--line:#5f7387;--hover:#e8f0f7;--soft:#bfd3e6}
body[data-theme="mono"]     {--bg:#e3e3e3;--paper:#fcfcfc;--ink:#1d1d1d;--line:#6b6b6b;--hover:#efefef;--soft:#d0d0d0}
body.dark[data-theme="parchment"]{--bg:#111814;--paper:#1a231d;--ink:#e2eee5;--line:#87a18c;--hover:#232f27;--soft:#2f4136}
body.dark[data-theme="moss"]     {--bg:#16150e;--paper:#211f17;--ink:#efebd5;--line:#a39b72;--hover:#2c2a1f;--soft:#3e3a28}
body.dark[data-theme="rose"]     {--bg:#171113;--paper:#22191c;--ink:#f3e5e8;--line:#b08c95;--hover:#2e2327;--soft:#433138}
body.dark[data-theme="slate"]    {--bg:#0f141a;--paper:#182029;--ink:#e2eaf3;--line:#8499ae;--hover:#222c37;--soft:#2e3b4b}
body.dark[data-theme="mono"]     {--bg:#111111;--paper:#1b1b1b;--ink:#ececec;--line:#8e8e8e;--hover:#272727;--soft:#383838}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);display:flex;gap:var(--gap);padding:var(--gap);height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
button{font:inherit;color:inherit}
svg{display:block;flex:none;shape-rendering:crispEdges}
::selection{background:var(--soft)}

/* ── ドットの角 (サイトの .card / .chip と同じ作り) ──
   外側 = 線の色、::before = 中の色。形は JS で作った --px-* を使う */
.px,.btn,.chip,.opt,.seg>button{position:relative;isolation:isolate;background:var(--edge,var(--line));clip-path:var(--o,var(--px-md-o));transition:background .15s}
.px::before,.btn::before,.chip::before,.opt::before,.seg>button::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--fill,var(--paper));clip-path:var(--i,var(--px-md-i));transition:background .15s}
.lg{--o:var(--px-lg-o);--i:var(--px-lg-i)}

.ic-btn{width:36px;height:36px;display:grid;place-items:center;border:0;background:none;color:var(--line);cursor:pointer;flex:none;clip-path:var(--px-sm-o);transition:background .12s,color .12s}
.ic-btn:hover{background:var(--hover);color:var(--ink)}
:focus-visible{outline:2px dashed var(--line);outline-offset:2px}

/* ── sidebar ── */
#side{width:var(--side-w);flex:none;display:flex;flex-direction:column;z-index:40;transition:margin .3s var(--ease),transform .3s var(--ease)}
body.side-closed #side{margin-left:calc(-1 * (var(--side-w) + var(--gap)))}
.side-head{display:flex;align-items:center;gap:10px;padding:18px 14px 6px 20px}
.logo{flex:1;display:flex;align-items:center;gap:10px;font-size:24px;line-height:1}
.logo img{width:28px;height:28px;display:block;image-rendering:pixelated}
.side-tools{padding:10px 16px 10px;display:flex;flex-direction:column;gap:10px}
#new-btn{--fill:var(--soft);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;border:0;font-size:16px;cursor:pointer}
#new-btn:hover{--edge:var(--ink);--fill:var(--hover)}
#new-btn:active{transform:translateY(1px)}
.search{--fill:var(--paper);display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;color:var(--line)}
.search:focus-within{--edge:var(--ink)}
#search{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--ink);font:15px var(--ui);outline:none}
#search::placeholder{color:var(--line);opacity:.8}
#search::-webkit-search-cancel-button{display:none}
#list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--soft) transparent;padding:4px 12px 12px;overscroll-behavior:contain}
.item{position:relative;display:flex;align-items:center;gap:4px;margin-bottom:2px;padding:10px 40px 10px 6px;cursor:pointer;user-select:none;-webkit-user-select:none;clip-path:var(--px-sm-o);transition:background .12s}
.item:hover{background:var(--hover)}
.item.active{background:var(--soft)}
.grip{width:16px;height:22px;display:grid;place-items:center;color:var(--line);opacity:0;cursor:grab;touch-action:none;flex:none;transition:opacity .15s}
.item:hover .grip{opacity:1}
#list.searching .grip{visibility:hidden}
.item-body{flex:1;min-width:0}
.item-title{font-size:16px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.untitled .item-title{color:var(--line)}
.item-sub{font-size:12px;line-height:1.6;color:var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.item-del{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:grid;place-items:center;border:0;background:none;color:var(--line);cursor:pointer;opacity:0;clip-path:var(--px-sm-o);transition:opacity .15s,color .15s,background .15s}
.item:hover .item-del{opacity:1}
.item-del:hover{color:var(--danger);background:var(--paper)}
.item.dragging{opacity:.35}
.item.drop-before::before,.item.drop-after::after{content:'';position:absolute;left:8px;right:8px;height:4px;background:var(--line)}
.item.drop-before::before{top:0}.item.drop-after::after{bottom:0}
.empty-list{padding:28px 8px;text-align:center;font-size:14px;color:var(--line)}
.side-foot{display:flex;align-items:center;gap:4px;margin:0 4px;padding:10px 10px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(90deg,var(--soft) 50%,transparent 0) top/8px 2px repeat-x}
#count{flex:1;font-size:13px;color:var(--line);padding-left:8px}
#side-scrim{display:none}

/* ── main ── */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:62px;flex:none;display:flex;align-items:center;gap:6px;padding:0 14px}
#topbar.lined{background:linear-gradient(90deg,var(--soft) 50%,transparent 0) bottom/8px 2px repeat-x}
#toolbar{--fill:var(--paper);flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:2px;margin-left:4px;padding:5px 7px;overflow-x:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
.tb{min-width:34px;height:34px;padding:0 7px;flex:none;display:grid;place-items:center;border:0;background:none;color:var(--line);font:16px/1 var(--ui);cursor:pointer;touch-action:manipulation;clip-path:var(--px-sm-o);transition:background .12s,color .12s}
.tb:hover{background:var(--hover);color:var(--ink)}
.tb.on{background:var(--soft);color:var(--ink)}
.tb-sep{width:2px;height:16px;background:var(--soft);margin:0 5px;flex:none}
#saved{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--line);padding:0 6px;white-space:nowrap;flex:none}
#saved::before{content:'';width:6px;height:6px;background:var(--soft);transition:background .2s}
#saved.saving::before{background:var(--line)}
#saved.error{color:var(--danger)}#saved.error::before{background:var(--danger)}
#scroll{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--soft) transparent;overscroll-behavior:contain}
#paper{max-width:780px;margin:0 auto;padding:40px 56px 45vh}
#title{display:block;width:100%;border:0;background:none;resize:none;outline:none;overflow:hidden;color:var(--ink);font-family:var(--pixel)!important;font-size:30px;line-height:1.35}
#title::placeholder{color:var(--line);opacity:.55}
#meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;margin:12px 0 28px;padding-bottom:20px;font-size:13px;color:var(--line);background:linear-gradient(90deg,var(--soft) 50%,transparent 0) bottom/8px 2px repeat-x}
#meta>*+*::before{content:'・';margin:0 .5em;color:var(--soft)}
#font-btn{display:inline-flex;align-items:center;gap:0;border:0;background:none;color:inherit;font-size:13px;cursor:pointer;text-decoration:underline dotted;text-underline-offset:4px}
#font-btn svg{display:none}
#font-btn:hover{color:var(--ink)}

/* ── editor ── */
#area{position:relative;outline:none;font-size:16.5px;line-height:1.9;color:var(--ink);min-height:40vh;word-break:break-word;overflow-wrap:anywhere;caret-color:var(--line);-webkit-touch-callout:none}
#area.empty::before{content:'ここから書きはじめる…\A\A「# 」見出し　「- 」リスト　「[] 」Todo　「**太字**」';white-space:pre-wrap;position:absolute;top:0;left:0;right:0;color:var(--line);opacity:.75;pointer-events:none;font:15px/1.9 var(--pixel)}
#area h1,#area h2,#area h3{font-family:var(--pixel);font-weight:normal}
#area h1{font-size:26px;line-height:1.45;margin:.9em 0 .3em}
#area h2{font-size:20px;line-height:1.55;margin:.8em 0 .2em}
#area h3{font-size:17px}
#area>:first-child{margin-top:0}
#area blockquote{margin:.5em 0;padding:.5em 1em;background:var(--hover);border-left:4px solid var(--soft);color:var(--ink)}
#area ul,#area ol{padding-left:1.5em;margin:.15em 0}
#area ul{list-style:square}
#area li::marker{color:var(--line)}
#area ol li::marker{font-family:var(--pixel)}
#area b,#area strong{font-weight:700}
#area a{color:var(--line)}
#area hr{border:0;height:4px;margin:1.4em 0;background:linear-gradient(90deg,var(--soft) 50%,transparent 0) 0 0/8px 4px repeat-x}
.todo{position:relative;padding-left:1.9em}
.todo::before{content:'';position:absolute;left:1px;top:7px;width:20px;height:20px;background:var(--line);cursor:pointer;
  -webkit-mask:var(--chk-off) center/100% 100% no-repeat;mask:var(--chk-off) center/100% 100% no-repeat;transition:background .12s}
.todo:hover::before{background:var(--ink)}
.todo[data-checked="true"]::before{-webkit-mask-image:var(--chk-on);mask-image:var(--chk-on)}
.todo[data-checked="true"]{color:var(--line);text-decoration:line-through;text-decoration-color:var(--line)}
.todo[data-reset-label]::after{content:'↻ ' attr(data-reset-label);display:inline-block;margin-left:.7em;padding:0 .6em;background:var(--hover);font:12px/1.9 var(--pixel);color:var(--line);vertical-align:.12em;clip-path:var(--px-xs-o);user-select:none;-webkit-user-select:none;pointer-events:none}

/* ── popover menu ── */
#menu{position:fixed;z-index:60;min-width:220px;padding:10px;display:none}
#menu.open{display:block;animation:pop .16s var(--ease)}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;font-size:15px;color:var(--ink);text-align:left;cursor:pointer;clip-path:var(--px-sm-o)}
.mi:hover{background:var(--hover)}
.mi svg{color:var(--line)}
.mi.danger,.mi.danger svg{color:var(--danger)}
.mi-sep{height:2px;margin:6px 8px;background:linear-gradient(90deg,var(--soft) 50%,transparent 0) 0 0/8px 2px repeat-x}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ── sheet (modal) ── */
#sheet-wrap{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center}
#sheet-wrap.open{display:flex}
#sheet-scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);animation:fade .2s}
#sheet{width:min(460px,calc(100% - 32px));max-height:min(680px,86dvh);display:flex;animation:rise .3s var(--ease)}
#sheet-body{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--soft) transparent;padding:28px 26px 24px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
#sheet h3{font-size:22px;font-weight:normal;margin-bottom:8px}
#sheet .lead{font-size:14px;color:var(--line);line-height:1.8}
#sheet .lead b{font-weight:normal;color:var(--ink)}
.sec{font-size:14px;color:var(--line);margin:22px 0 10px}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sw{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;border:0;background:none;cursor:pointer;font-size:13px;color:var(--line);clip-path:var(--px-sm-o)}
.sw:hover{background:var(--hover)}
.sw i{width:32px;height:32px;display:block;clip-path:var(--px-sm-o)}
.sw.on{color:var(--ink);background:var(--hover)}
.sw.on i{box-shadow:inset 0 0 0 4px var(--ink)}
.seg{display:flex;gap:6px}
.seg>button{flex:1;height:42px;border:0;font-size:15px;color:var(--line);cursor:pointer}
.seg>button:hover{--fill:var(--hover)}
.seg>button.on{--fill:var(--soft);--edge:var(--ink);color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{--o:var(--px-md-o);display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:13px 16px;border:0;background:var(--hover);font-size:15px;text-align:left;cursor:pointer;clip-path:var(--px-md-o);transition:background .12s}
.row:hover{background:var(--soft)}
.row .v{color:var(--line);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 16px;border:0;font-size:15px;text-align:left;cursor:pointer}
.opt:hover{--fill:var(--hover)}
.opt.on{--fill:var(--soft);--edge:var(--ink)}
.opt .chk{color:var(--ink)}
.note{font-size:13px;line-height:1.85;color:var(--line);background:var(--hover);padding:12px 16px;clip-path:var(--px-md-o)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.acts.split>*{flex:1}
.btn{height:44px;padding:0 20px;border:0;font-size:16px;cursor:pointer;white-space:nowrap}
.btn:hover{--edge:var(--ink);--fill:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{--fill:var(--soft)}
.btn.danger{--edge:var(--danger);--fill:var(--danger);color:#fff}
.btn.danger:hover{--edge:var(--ink)}
.input{width:100%;height:48px;padding:0 16px;border:0;background:var(--hover);color:var(--ink);font:16px var(--ui);outline:none;clip-path:var(--px-md-o);box-shadow:inset 0 0 0 3px transparent;transition:box-shadow .15s}
.input:focus{box-shadow:inset 0 0 0 3px var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border:0;font-size:14px;color:var(--ink);cursor:pointer}
.chip:hover{--edge:var(--ink);--fill:var(--hover)}
.chip.on{--fill:var(--soft);--edge:var(--ink)}
.chip .x{display:grid;place-items:center;width:18px;height:18px;margin-right:-6px;color:var(--line)}
.chip .x:hover{color:var(--danger)}

#toast{position:fixed;left:50%;bottom:calc(28px + var(--kb) + env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:80;padding:12px 22px;background:var(--ink);color:var(--paper);font-size:15px;opacity:0;pointer-events:none;clip-path:var(--px-md-o);transition:opacity .2s,transform .2s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ── mobile ── */
@media (max-width:760px){
  body{padding:0;gap:0;background:var(--paper)}
  #main{clip-path:none;background:var(--paper)}
  #main::before{display:none}
  #side{position:fixed;left:8px;top:8px;bottom:8px;width:min(86vw,340px);margin:0!important;transform:translateX(calc(-100% - 16px));visibility:hidden;transition:transform .3s var(--ease),visibility 0s .3s}
  body.drawer #side{transform:none;visibility:visible;transition:transform .3s var(--ease)}
  body.drawer #side-scrim{display:block;position:fixed;inset:0;z-index:35;background:color-mix(in srgb,var(--ink) 35%,transparent);animation:fade .2s}
  .grip,.item-del{opacity:.7}
  #topbar{height:56px;padding:0 8px}
  #toolbar{position:fixed;left:8px;right:8px;bottom:calc(var(--kb) + 8px);z-index:30;margin:0;gap:0;padding:6px 8px;display:none;overflow:hidden;touch-action:none}
  body.editing #toolbar{display:flex}
  .tb{flex:1 1 0;min-width:0;height:40px;padding:0}
  .tb-sep{display:none}
  #paper{padding:18px 20px 55vh}
  #title{font-size:26px}
  #meta{margin-bottom:22px}
  #sheet-wrap{align-items:flex-end;padding:8px}
  #sheet{width:100%;max-height:88dvh}
  #sheet-body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body data-theme="parchment">

<aside id="side" class="px lg" aria-label="メモ一覧">
  <div class="side-head">
    <div class="logo"><img src="memo_icons.png" alt="">文綴</div>
    <button class="ic-btn" id="side-close" title="一覧を閉じる"></button>
  </div>
  <div class="side-tools">
    <button id="new-btn" class="px"></button>
    <label class="search px"><span id="search-ic"></span><input id="search" type="search" placeholder="メモを検索" autocomplete="off"></label>
  </div>
  <div id="list"></div>
  <div class="side-foot">
    <span id="count"></span>
    <button class="ic-btn" id="settings-btn" title="設定"></button>
  </div>
</aside>
<div id="side-scrim"></div>

<main id="main" class="px lg">
  <header id="topbar">
    <button class="ic-btn" id="side-open" title="メモ一覧"></button>
    <div id="toolbar" class="px" role="toolbar" aria-label="書式">
      <button class="tb" data-cmd="h1" title="見出し（# ）">H1</button>
      <button class="tb" data-cmd="h2" title="小見出し（## ）">H2</button>
      <span class="tb-sep"></span>
      <button class="tb" data-cmd="bold" title="太字（Ctrl+B / **文字**）"><b>B</b></button>
      <button class="tb" data-cmd="italic" title="斜体（Ctrl+I / *文字*）"><i style="font-family:serif">I</i></button>
      <button class="tb" data-cmd="underline" title="下線（Ctrl+U）"><u>U</u></button>
      <button class="tb" data-cmd="strikeThrough" title="取り消し線（~~文字~~）"><s>S</s></button>
      <span class="tb-sep"></span>
      <button class="tb" data-cmd="ul" title="リスト（- ）"></button>
      <button class="tb" data-cmd="ol" title="番号リスト（1. ）">1.</button>
      <button class="tb" data-cmd="todo" title="Todo（[] ）"></button>
      <button class="tb" data-cmd="blockquote" title="引用（> ）"></button>
    </div>
    <span id="saved">保存済み</span>
    <button class="ic-btn" id="more-btn" title="このメモ"></button>
  </header>
  <div id="scroll">
    <div id="paper">
      <textarea id="title" rows="1" placeholder="無題" spellcheck="false"></textarea>
      <div id="meta">
        <span id="m-time"></span>
        <span id="m-count"></span>
        <button id="font-btn" title="このメモのフォントを変える"></button>
      </div>
      <div id="area" contenteditable="true" spellcheck="false"></div>
    </div>
  </div>
</main>

<div id="menu" class="px" role="menu"></div>
<div id="sheet-wrap"><div id="sheet-scrim"></div><div id="sheet" class="px lg" role="dialog" aria-modal="true"><div id="sheet-body"></div></div></div>
<div id="toast" role="status"></div>
<input type="file" id="file-in" accept="application/json,.json" hidden>

<script>
'use strict';
/* ═══════════ pixel corners (same idea as the site's .card/.chip, scaled up to ~24px) ═══════════ */
(function () {
  const P = (v, far) => far ? `calc(100% - ${v}px)` : `${v}px`;
  function shape(u, s, b) {
    const n = u.length, pts = [];
    const add = (x, fx, y, fy) => pts.push(`${P(x, fx)} ${P(y, fy)}`);

/* markdown-ish shortcuts at line start (半角/全角どちらでも) */
const LINE_MD = [
  [/^(##|＃＃)[ 　 ]$/, 'h2'],
  [/^(#|＃)[ 　 ]$/, 'h1'],
  [/^(>|＞)[ 　 ]$/, 'blockquote'],
  [/^[-*・－ー][ 　 ]$/, 'ul'],
  [/^[1１][.．][ 　 ]$/, 'ol'],
  [/^[\[［][ 　 ]?[\]］][ 　 ]$/, 'todo'],
  [/^[\[［][xXｘＸ][\]］][ 　 ]$/, 'done'],
  [/^(---|ーーー|－－－)$/, 'hr'],

function lineShortcut() {
  const r = caretRange();
  if (!r || !r.collapsed) return false;
  const b = lineBlock(r.startContainer);
  if (!b || !/^(DIV|P)$/.test(b.nodeName) || b.closest('li,blockquote,h1,h2')) return false;
  if (b.classList.contains('todo')) return false;
  const text = beforeCaret(b, r).toString();
  const hit = LINE_MD.find(([re]) => re.test(text));
  if (!hit) return false;
  const kind = hit[1];
  if (kind === 'hr' && b.textContent !== text) return false;
  beforeCaret(b, r).deleteContents();
  ensureFilled(b);
  setCaret(b, 0);
  if (kind === 'todo' || kind === 'done') { makeTodo(b, kind === 'done'); setCaret(b, 0); }
  else if (kind === 'ul') document.execCommand('insertUnorderedList');
  else if (kind === 'ol') document.execCommand('insertOrderedList');
  else if (kind === 'hr') {
    const hr = document.createElement('hr');
    b.before(hr);
  }

}
/* **太字** *斜体* ~~取り消し~~ */
const INLINE_MD = [
  [/\*\*([^*\n]+)\*\*$/, 'bold', 2],
  [/~~([^~\n]+)~~$/, 'strikeThrough', 2],
  [/(?:^|[^*])\*([^*\s][^*\n]*)\*$/, 'italic', 1],

function inlineShortcut() {
  const r = caretRange();
  if (!r || !r.collapsed || r.startContainer.nodeType !== 3) return false;
  const node = r.startContainer, end = r.startOffset, before = node.data.slice(0, end);
  for (const [re, cmd, ml] of INLINE_MD) {
    const m = before.match(re);
    if (!m) continue;
    const inner = m[1], start = end - inner.length - ml * 2;
    node.deleteData(end - ml, ml);
    node.deleteData(start, ml);
    const s = getSelection(), x = document.createRange();
    x.setStart(node, start); x.setEnd(node, start + inner.length);
    s.removeAllRanges(); s.addRange(x);
    document.execCommand(cmd);
    s.collapseToEnd();
    if (document.queryCommandState(cmd)) document.execCommand(cmd);
    return true;
  }
  return false;
}

/* Enter / Backspace inside todos.

  if (!t.textContent.replace(/[\s​]/g, '')) { unTodo(t); ensureFilled(t); setCaret(t, 0); return true; }

  n.appendChild(frag);
  [...n.querySelectorAll('*')].forEach(el => { if (!el.textContent && !/^(BR|IMG|HR)$/.test(el.nodeName) && !el.querySelector('br,img')) el.remove(); });
  fixTodo(n); ensureFilled(t);

}

  return false;

const TB_ICONS = { ul: ICON.ul, todo: ICON.todo, blockquote: ICON.quote };

  const recent = settings.recentFonts.filter(f => !FONT_PRESETS.includes(f));
  openSheet(`<h3>${isPage ? 'このメモのフォント' : '画面の文字のフォント'}</h3>
    <p class="lead">${isPage ? 'メモごとに本文のフォントを変えられます。' : 'ボタンや一覧などの文字です。'}<a href="https://fonts.google.com/?subset=japanese" target="_blank" rel="noopener" style="color:var(--acc)">Google Fonts</a> にあるフォントなら名前を入れて使えます。</p>
    <div class="sec">フォント名</div>
    <input class="input" id="font-in" autocomplete="off" spellcheck="false" placeholder="例: Klee One">
    <div class="sec">おすすめ</div>
    <div class="chips">${FONT_PRESETS.map(f => chip(f)).join('')}</div>
    ${recent.length ? `<div class="sec">最近使った</div><div class="chips">${recent.map(f => chip(f, true)).join('')}</div>` : ''}
    <div class="acts"><button class="btn" data-close>キャンセル</button><button class="btn primary" id="font-ok">決定</button></div>`, s => {
    const inp = s.querySelector('#font-in');
    inp.value = cur;
    const apply = name => {
      const f = cleanFont(name);
      if (!f) return toast('フォント名を入れてね');
      injectFont(f);
      settings.recentFonts = [f, ...settings.recentFonts.filter(x => x !== f)].slice(0, 8);
      if (isPage) { activePage().font = f; loadPage(true); sync(false); }
      else { settings.uiFont = f; applyTheme(); }
      saveSettings(); closeSheet();
      document.fonts && document.fonts.load(`16px '${f}'`).then(list => { if (!list.length) toast(`「${f}」が見つからないかも…`); }).catch(() => {});
    };
    s.querySelectorAll('.chip').forEach(c => c.onclick = e => {
      const x = e.target.closest('.x');
      if (x) {
        e.stopPropagation();
        settings.recentFonts = settings.recentFonts.filter(f => f !== x.dataset.x);
        saveSettings(); c.remove(); return;
      }
      apply(c.dataset.f);
    });
    s.querySelector('#font-ok').onclick = () => apply(inp.value);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) apply(inp.value); });
    if (!isMobile()) setTimeout(() => inp.select(), 30);
  });
}
$('#font-btn').onclick = () => openFontSheet('page');

/* ═══════════ export / backup ═══════════ */
function toText(html, md) {
  const t = document.createElement('template');
  t.innerHTML = html || '';
  stripZW(t.content);
  const out = [];
  const inline = n => {
    let s = '';
    n.childNodes.forEach(c => {
      if (c.nodeType === 3) s += c.data;
      else if (c.nodeName === 'BR') s += '\n';
      else if (!md) s += (isBlock(c) ? '\n' : '') + inline(c);
      else if (/^(B|STRONG)$/.test(c.nodeName)) s += wrapMd(inline(c), '**');
      else if (/^(I|EM)$/.test(c.nodeName)) s += wrapMd(inline(c), '*');
      else if (/^(S|STRIKE|DEL)$/.test(c.nodeName)) s += wrapMd(inline(c), '~~');
      else s += (isBlock(c) ? '\n' : '') + inline(c);
    });
    return s;
  };
  const wrapMd = (s, m) => s.trim() ? m + s + m : s;
  const line = n => inline(n).replace(/\n$/, '');
  const walk = (node, depth) => {
    node.childNodes.forEach(c => {
      if (c.nodeType === 3) { if (c.data.trim()) out.push(c.data); return; }
      if (c.nodeType !== 1) return;
      const tag = c.nodeName;
      if (/^H[1-6]$/.test(tag)) out.push((md ? '#'.repeat(+tag[1]) + ' ' : '') + line(c).trim());
      else if (tag === 'BLOCKQUOTE') line(c).split('\n').forEach(l => out.push((md ? '> ' : '　') + l));
      else if (tag === 'UL' || tag === 'OL') {
        let i = 1;
        c.childNodes.forEach(li => {
          if (li.nodeName === 'LI') {
            const clone = li.cloneNode(true);
            clone.querySelectorAll('ul,ol').forEach(x => x.remove());
            out.push('  '.repeat(depth) + (tag === 'OL' ? `${i++}. ` : md ? '- ' : '・') + line(clone).trim());
            li.querySelectorAll(':scope > ul, :scope > ol').forEach(sub => walk({ childNodes: [sub] }, depth + 1));
          } else if (li.nodeName === 'UL' || li.nodeName === 'OL') walk({ childNodes: [li] }, depth + 1);
        });
      }
      else if (tag === 'HR') out.push(md ? '---' : '――――');
      else if (c.classList.contains('todo')) {
        const on = c.dataset.checked === 'true';
        out.push((md ? (on ? '- [x] ' : '- [ ] ') : (on ? '☑ ' : '☐ ')) + line(c).trim());
      }
      else if ([...c.childNodes].some(isBlock)) walk(c, depth);
      else out.push(line(c));
    });
  };
  walk(t.content, 0);
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const safeName = s => (s.trim() || '無題').replace(/[\\/:*?"<>|\n]/g, '_').slice(0, 60);
function exportPage(kind) {
  if (dirty) persist();
  const p = activePage(), md = kind === 'md';
  const head = p.title.trim() ? (md ? '# ' : '') + p.title.trim() + '\n\n' : '';
  download(`${safeName(p.title)}.${md ? 'md' : 'txt'}`, head + toText(p.content, md), md ? 'text/markdown' : 'text/plain');
}
function backup() {
  if (dirty) persist();
  const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  download(`文綴-バックアップ-${stamp}.json`, JSON.stringify({ app: 'fumi', version: 8, exportedAt: d.toISOString(), pages }, null, 1), 'application/json');
  toast('バックアップを保存しました');
}
$('#file-in').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch { return toast('ファイルを読めませんでした'); }
  const inc = Array.isArray(data) ? data : data && Array.isArray(data.pages) ? data.pages : null;
  if (!inc) return toast('文綴のバックアップではないみたい');
  let added = 0;
  inc.forEach(p => {
    if (!p || typeof p !== 'object') return;
    const content = migrateHTML(String(p.content || ''));
    const same = pages.find(x => x.id === p.id);
    if (same && same.content === content && same.title === String(p.title || '')) return;
    pages.push({ id: same ? uid() : String(p.id || uid()), title: String(p.title || ''), content, font: cleanFont(p.font) || DEFAULT_FONT, updatedAt: +p.updatedAt || Date.now() });
    added++;
  });
  persist(); renderList(); closeSheet();
  toast(added ? `${added} 件のメモを読み込みました` : '新しいメモはありませんでした');
});

/* ═══════════ global keys ═══════════ */
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === 'Escape') {
    if (sheetWrap.classList.contains('open')) closeSheet();
    else if (menu.classList.contains('open')) closeMenu();
    else closeDrawer();
  }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); persist(); toast('保存しました'); }
  if (mod && e.key.toLowerCase() === 'd' && !e.shiftKey) {
    e.preventDefault();
    const cur = document.body.classList.contains('dark');
    settings.dark = !cur; applyTheme(); saveSettings();
  }
});

/* ═══════════ init ═══════════ */
const setIcon = (id, html) => { $(id).innerHTML = html; };
setIcon('#side-open', ICON.side); setIcon('#side-close', ICON.side); setIcon('#settings-btn', ICON.gear); setIcon('#more-btn', ICON.more); setIcon('#search-ic', ICON.search);
$('#new-btn').innerHTML = ICON.plus + '<span>新しいメモ</span>';
document.body.classList.toggle('side-closed', !!settings.sideClosed);
applyTheme();
loadPage();
resetAll();
renderList();
if (migrated) persist();
</script>
